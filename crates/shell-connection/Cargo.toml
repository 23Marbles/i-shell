[package]
name = "shell-connection"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
rmp-serde = "1.3.1"
rustls = "0.23"
rustls-pemfile = "2.2"
serde = { version = "1.0.229", features = ["serde_derive"] }
shell-core = { path = "../shell-core", features = ["serde"] }
tokio-rustls = "0.26"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["serde", "v4", "v6", "v7"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
