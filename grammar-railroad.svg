<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 772 119">
<style type="text/css">
svg.railroad {
background-color: hsl(230, 10%, 20%);
background-size: 15px 15px;
background-image: linear-gradient(to right, rgba(150, 150, 150, .05) 1px, transparent 1px),
		  linear-gradient(to bottom, rgba(150, 150, 150, .05) 1px, transparent 1px);
}

svg.railroad rect.railroad_canvas {
stroke-width: 0px;
fill: none;
}

svg.railroad path {
stroke-width: 3px;
stroke: hsl(200, 10%, 60%);
fill: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
fill: hsl(230, 30%, 80%);
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect {
stroke-width: 3px;
stroke: hsl(200, 10%, 50%);
fill: hsl(230, 20%, 20%);
}

svg.railroad g.labeledbox &gt; rect {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}
</style>
<style type="text/css">
svg.railroad .fragment_ty &gt; rect {
fill: hsl(0, 100%, 30%);
}
svg.railroad .fragment_ident &gt; rect {
fill: hsl(39, 100%, 30%);
}

svg.railroad .fragment_path &gt; rect {
fill: hsl(120, 100%, 25%);
}

svg.railroad .fragment_expr &gt; rect {
fill: hsl(60, 100%, 25%);
}

svg.railroad .fragment_pat &gt; rect {
fill: hsl(195, 100%, 25%);
}

svg.railroad .fragment_pat_param &gt; rect {
fill: hsl(215, 100%, 30%);
}

svg.railroad .fragment_stmt &gt; rect {
fill: hsl(205, 100%, 25%);
}

svg.railroad .fragment_block &gt; rect {
fill: hsl(164, 100%, 25%);
}

svg.railroad .fragment_item &gt; rect {
fill: hsl(300, 24%, 25%);
}

svg.railroad .fragment_meta &gt; rect {
fill: hsl(300, 76%, 30%);
}

svg.railroad .fragment_tt &gt; rect {
fill: hsl(174, 72%, 30%);
}

svg.railroad .fragment_vis &gt; rect {
fill: hsl(33, 100%, 25%);
}

svg.railroad .fragment_literal &gt; rect {
fill: hsl(20, 93%, 30%);
}

svg.railroad .fragment_lifetime &gt; rect {
fill: teal;
}

svg.railroad .legend {
transform: scale(0.85);
transform-origin: bottom left;
/*transform-box: fill-box;*/
}

svg.railroad .legend &gt; rect {
stroke: grey;
stroke-width: 0.5px;
stroke-dasharray: 2px;
fill: rgba(90, 90, 90, .1)
}

svg.railroad .legend .comment:first-child {
text-decoration: underline;
}
</style>
